spring:
  application:
    name: gestao-veiculos
    version: 0.0.1-SNAPSHOT

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      access: read-only

logging:
  level:
    com.montadora.gestao: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/fleet
    username: fleet
    password: fleet
  docker:
    compose:
      enabled: false
  jpa:
    properties:
      hibernate.format_sql: false

logging:
  structured:
    format:
      console: ecs
  level:
    com.montadora.gestao: INFO
