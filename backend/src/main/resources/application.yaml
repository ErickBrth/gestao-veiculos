spring:
  application:
    name: gestao-veiculos
    version: 0.0.1-SNAPSHOT

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s
    serviceclient:
      viacep:
        base-url: https://viacep.com.br/ws
        connect-timeout: 2s
        read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      access: read-only

logging:
  level:
    com.montadora.gestao: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
